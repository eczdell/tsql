[package]
name = "tsql"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
tokio-postgres-rustls = "0.7"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
chrono = "0.4"
dirs = "5.0"
clap = { version = "4.4", features = ["derive"] }
nucleo-matcher = "0.3"
rustls = "0.19"

